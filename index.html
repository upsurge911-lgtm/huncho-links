<!DOCTYPE html>
<html lang="en" class="scheme-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Huncho</title>

  <meta name="theme-color" content="#0a4d8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta property="og:title" content="Huncho" />
  <meta name="author" content="Huncho" />
  <meta property="og:locale" content="en_US" />
  <meta name="description" content="Order now on Careem, Deliveroo & Talabat." />
  <meta property="og:description" content="Order now on Careem, Deliveroo & Talabat." />
  <meta property="og:site_name" content="Huncho" />
  <meta property="og:image" content="./images/huncho-logo.svg" />
  <meta property="og:type" content="article" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta property="twitter:image" content="./images/huncho-logo.svg" />
  <meta property="twitter:title" content="Huncho" />

  <link rel="apple-touch-icon" sizes="180x180" href="./images/huncho-logo.svg">
  <link rel="shortcut icon" href="./images/huncho-logo.svg">
  <meta name="apple-mobile-web-app-title" content="Huncho">
  <meta name="application-name" content="Huncho">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-shape bg-shape-1" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-2" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-3" aria-hidden="true"></div>

  <main class="container">
    <section class="card profile-card">
      <img src="./images/huncho-logo.svg" alt="Huncho" class="profile-logo" />
      <p class="description">Order now on Careem, Deliveroo &amp; Talabat.</p>
    </section>

    <nav class="links" aria-label="Primary links">
      <a href="https://link.careem.com/ifuvoisWSRSaF" target="_blank" class="card link-button" alt="Order Huncho on Careem" title="Order Huncho on Careem">
        <span class="link-icon" aria-hidden="true"><i class="fa-solid fa-motorcycle"></i></span>
        <span class="link-text">Order on Careem</span>
      </a>

      <a href="https://www.talabat.com/uae/huncho" target="_blank" class="card link-button" alt="Order Huncho on Talabat" title="Order Huncho on Talabat">
        <span class="link-icon" aria-hidden="true"><i class="fa-solid fa-bag-shopping"></i></span>
        <span class="link-text">Order on Talabat</span>
      </a>

      <a href="https://www.deliveroo.ae/" target="_blank" class="card link-button" alt="Order Huncho on Deliveroo" title="Order Huncho on Deliveroo">
        <span class="link-icon" aria-hidden="true"><i class="fa-solid fa-utensils"></i></span>
        <span class="link-text">Order on Deliveroo</span>
      </a>
    </nav>

    <div class="card button-container">
      <div class="button-group">
        <a href="https://www.instagram.com/huncho_arabia" title="Huncho on Instagram" target="_blank" class="icon-button" alt="Huncho on Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
      </div>
    </div>

    <footer class="footer">
      <div class="copyright">© 2026 Huncho. All rights reserved.</div>
    </footer>
  </main>
</body>
</html>
